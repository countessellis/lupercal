  windows:
    name: Windows MSI (${{ matrix.arch }})
    runs-on: windows-latest

    strategy:
      matrix:
        arch:
          - x86_64
          - aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.arch }}-pc-windows-msvc

      - name: Add WiX to PATH
        run: echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" >> $env:GITHUB_PATH

      - name: Install cargo-wix
        run: cargo install cargo-wix

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.arch }}-pc-windows-msvc

      - name: Build MSI
        run: cargo wix --target ${{ matrix.arch }}-pc-windows-msvc

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: target/wix/*.msi

  publish:
    name: Publish GitHub Release
    #needs: [linux, macos, windows]
    needs: [linux, windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
