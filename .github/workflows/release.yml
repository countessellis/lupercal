name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux Packages (${{ matrix.target }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        uses: taiki-e/install-action@cross

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm gcc-aarch64-linux-gnu
          cargo install cargo-deb
          cargo install cargo-generate-rpm

      - name: Build release binary
        run: cross build --release --bins --target ${{ matrix.target }}

      - name: Build .deb package
        run: cargo deb --target ${{ matrix.target }}

      - name: Build .rpm package
        run: cargo generate-rpm build --target ${{ matrix.target }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/debian/*.deb
            target/${{ matrix.target }}/generate-rpm/*.rpm

  macos:
    name: macOS Packages (${{ matrix.arch }})
    runs-on: macos-latest

    strategy:
      matrix:
        arch:
          - x86_64
          - aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.arch }}-apple-darwin

      - name: Build release binary
        run: cargo build --release --bins --target ${{ matrix.arch }}-apple-darwin

      - name: Archive Binaries
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../lupercal-macos-${{ matrix.target }}.tar.gz lupercal lupercal-client lupercal-server lupercal-proxy lupercal-convert

      - name: Upload macOS artifact
        uses: softprops/action-gh-release@v2
        with:
          files: lupercal-${{ matrix.arch }}.tar.gz

  windows:
    name: Windows MSI (${{ matrix.arch }})
    runs-on: windows-latest

    strategy:
      matrix:
        arch:
          - x86_64
          - aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.arch }}-pc-windows-msvc

      - name: Install Cross
        uses: taiki-e/install-action@cross

      - name: Add WiX to PATH
        run: echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" >> $env:GITHUB_PATH

      - name: Install cargo-wix
        run: cargo install cargo-wix

      - name: Build with Cross
        run: cross build --release --bins --target ${{ matrix.arch }}-pc-windows-msvc
        env:
          OPENSSL_VENDORED: 1

      - name: Build MSI
        run: cargo wix --target ${{ matrix.arch }}-pc-windows-msvc ${{ matrix.arch == 'aarch64' && '-a a64' || '' }} --nocapture

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: target/wix/*.msi

  publish:
    name: Publish GitHub Release
    #needs: [linux, macos, windows]
    needs: [linux, windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
