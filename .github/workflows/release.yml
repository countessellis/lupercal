name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux Packages (${{ matrix.target }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install Tools
        uses: taiki-e/install-action@v2
        with:
          tool: cross,cargo-deb,cargo-generate-rpm

      - name: Build and Package
        env:
          OPENSSL_VENDORED: 1
          OPENSSL_STATIC: 1
          PKG_CONFIG_ALLOW_CROSS: 1
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cross build --release --bins --target ${{ matrix.target }}
          cross deb --target ${{ matrix.target }}
          cargo generate-rpm --target ${{ matrix.target }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/debian/*.deb
            target/${{ matrix.target }}/generate-rpm/*.rpm

  macos:
    name: macOS Packages (${{ matrix.arch }})
    runs-on: macos-latest

    strategy:
      matrix:
        arch:
          - x86_64
          - aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.arch }}-apple-darwin

      - name: Build release binary
        run: cargo build --release --bins --target ${{ matrix.arch }}-apple-darwin

      - name: Archive Binaries
        run: |
          tar -czf lupercal-macos-${{ matrix.arch }}.tar.gz \
          -C target/${{ matrix.arch }}-apple-darwin/release \
          lupercal lupercal-client lupercal-server lupercal-proxy lupercal-convert

      - name: Upload macOS artifact
        uses: softprops/action-gh-release@v2
        with:
          files: lupercal-${{ matrix.arch }}.tar.gz

  windows:
    name: Windows MSI (${{ matrix.arch }})
    runs-on: windows-latest

    strategy:
      matrix:
        arch:
          - x86_64
          - aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.arch }}-pc-windows-msvc

      - name: Install cargo-wix
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-wix

      - name: Add WiX to PATH
        run: echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" >> $env:GITHUB_PATH

      - name: Build with Cross
        run: cargo build --release --bins --target ${{ matrix.arch }}-pc-windows-msvc
        env:
          OPENSSL_VENDORED: 1

      - name: Build MSI (x64)
        if: matrix.arch == 'x86_64'
        run: cargo wix --target x86_64-pc-windows-msvc --nocapture

      - name: Build MSI (ARM64)
        if: matrix.arch == 'aarch64'
        run: |
          candle -arch a64 -dVersion=1.0.0 -out target/wix/main.wixobj wix/main.wxs
          light -ext WixUIExtension -out target/wix/lupercal-aarch64.msi target/wix/main.wixobj

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: target/wix/*.msi

  publish:
    name: Publish GitHub Release
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
