name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux Packages (${{ matrix.target }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm gcc-aarch64-linux-gnu
          cargo install cargo-deb
          cargo install cargo-rpm

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build .deb package
        run: cargo deb --target ${{ matrix.target }}

      - name: Build .rpm package
        run: cargo rpm build --target ${{ matrix.target }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/debian/*.deb
            target/${{ matrix.target }}/release/rpmbuild/RPMS/**/*.rpm

