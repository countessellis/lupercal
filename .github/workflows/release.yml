name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux Packages (${{ matrix.target }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install Tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild,cargo-deb,cargo-generate-rpm

      - name: Build and Package
        env:
          OPENSSL_VENDORED: 1
        run: |
          cargo zigbuild --release --bins --target ${{ matrix.target }}
          cargo deb --no-build --target ${{ matrix.target }}
          cargo generate-rpm --target ${{ matrix.target }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/debian/*.deb
            target/${{ matrix.target }}/generate-rpm/*.rpm

  macos:
    name: macOS Packages (${{ matrix.arch }})
    runs-on: macos-latest

    strategy:
      matrix:
        arch:
          - x86_64
          - aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.arch }}-apple-darwin

      - name: Build release binary
        run: cargo build --release --bins --target ${{ matrix.arch }}-apple-darwin

      - name: Archive Binaries
        run: |
          tar -czf lupercal-macos-${{ matrix.arch }}.tar.gz \
          -C target/${{ matrix.arch }}-apple-darwin/release \
          lupercal lupercal-client lupercal-server lupercal-proxy lupercal-convert

      - name: Upload macOS artifact
        uses: softprops/action-gh-release@v2
        with:
          files: lupercal-${{ matrix.arch }}.tar.gz

  windows:
    name: Windows MSI (${{ matrix.arch }})
    runs-on: windows-latest

    strategy:
      matrix:
        arch:
          - x86_64
          - aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.arch }}-pc-windows-msvc

      - name: Install cargo-wix
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-wix

      - name: Add WiX to PATH
        run: echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" >> $env:GITHUB_PATH

      - name: Build binaries
        run: cargo build --release --bins --target ${{ matrix.arch }}-pc-windows-msvc
        env:
          OPENSSL_VENDORED: 1

      - name: Build MSI
        shell: pwsh
        run: |
          if (!(Test-Path "target/wix")) { New-Item -ItemType Directory -Force -Path "target/wix" }
          $wixArch = if ("${{ matrix.arch }}" -eq "aarch64") { "arm64" } else { "x64" }
          candle -arch $wixArch -dBinPath="target/${{ matrix.arch }}-pc-windows-msvc/release" -out target/wix/main.wixobj wix/main.wxs
          light -ext WixUIExtension -out target/wix/lupercal-${{ matrix.arch }}.msi target/wix/main.wixobj


      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: target/wix/*.msi

  publish:
    name: Publish GitHub Release
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.msi
            artifacts/**/*.tar.gz
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
