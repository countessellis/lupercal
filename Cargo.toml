[package]
name = "lupercal"
licence = "MIT"
authors = ["Bethany Davis <ellis@despoena.com>"]
description = "A single binary console based Gemini Protocol server and client."
repository = "https://github.com/countessellis/lupercal"
homepage = "https://github.com/countessellis/lupercal"
readme = "README.md"
version = "0.1.0"
edition = "2024"
default-run = "lupercal"

[[bin]]
name = "lupercal"
path = "src/main.rs"

[[bin]]
name = "lupercal-server"
path = "src/main.rs"

[[bin]]
name = "lupercal-client"
path = "src/main.rs"

[[bin]]
name = "lupercal-proxy"
path = "src/main.rs"

[[bin]]
name = "lupercal-convert"
path = "src/main.rs"

[lib]
name = "lupercal"
path = "src/lib.rs"

[dependencies]
ansi_term = "0.12.1"
env_logger = "0.11.8"
log = "0.4.29"
openssl = { version = "0.10", features = ["vendored"] }
url = "2.5.7"
mime_guess = "2.0.5"
rpassword = "7.4.0"
ratatui = "0.30.0"
textwrap = "0.16.2"
tui-logger = { version = "0.18.0", features = ["tracing", "tracing-subscriber", "tracing-support"] }
gag = "1.0.0"
dirs = "6.0.0"
walkdir = "2.5.0"
tracing-subscriber = { version = "0.3.22", features = ["time"] }
is-terminal = "0.4.17"
hex = "0.4.3"
time = { version = "0.3.45", features = ["formatting", "macros", "parsing"] }

[build-dependencies]
chrono = "0.4.42"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

